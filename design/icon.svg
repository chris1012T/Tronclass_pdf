<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
    <defs>
        <!-- hollow check: a wide stroke with a narrower stroke cut out of it -->
        <mask id="check" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
            <g fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M43,66 L57,80 L85,48" stroke="#fff" stroke-width="14"/>
                <path d="M43,66 L57,80 L85,48" stroke="#000" stroke-width="7.5"/>
            </g>
        </mask>
    </defs>
    <!-- 4px outline on whole-pixel edges so the 128px render stays sharp; rounded corners like the original icon -->
    <path d="M35,18 H78 Q82,18 85,21 L97,33 Q100,36 100,40 V98 A8,8 0 0 1 92,106 H35 A8,8 0 0 1 27,98 V26 A8,8 0 0 1 35,18 Z" fill="#ffffff" stroke="#ff0000" stroke-linejoin="round" stroke-width="4"/>
    <rect width="128" height="128" fill="#00b1b3" mask="url(#check)"/>
</svg>
